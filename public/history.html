<!DOCTYPE html>
<html lang="id">
   <head>
    <meta charset="UTF-8">
    <title>Riwayat Kebiasaan</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/authCheck.js"></script>
    <script>checkAuth('user');</script>
   </head> 

   <body class="bg-gray-100 min-h-screen p-6">
        <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-3xl font-bold bg-white text-blue-600">Riwayat Kebiasaan</h1>
                <a href="./todolist.html" class="text-sm text-blue-500 hover:underline"> kembali ke Todo</a>
            </div>

            <!-- Navigasi bulan-->
            <div class="flex justify-between items-center mb-6">
                <button id="prevMonth" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">←</button>
                <h2 id="monthLabel" class="text-lg font-semibold text-gray-400"></h2>
                <button id="nextMonth" class="px-3 py-1 border border-gray-300 rounded hover:bg-gray-50">→</button>
            </div>

            <!-- Kalender grid-->
            <div class="grid grid-cols-7 gap-2 mb-4 text-center text-xs text-gray-500 font-medium">
                <div>Min</div><div>Sen</div><div>Sel</div><div>Rab</div><div>Kam</div><div>Jum</div><div>Sab</div>
              </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-2 mb-8"></div>

            <!-- Detail hari yang dipilih-->
            <div id="dayDetail" class="hidden border-t border-gray-200 pt-4 mb-8">
                <h3 id="dayDetailTitle" class="font-semibold text-gray-700 mb-2"></h3>
                <ul id="dayDetailList" class="flex flex-col gap-1"></ul>
            </div>

            <!-- Statik kebiasaan yang di skip-->
            <div class="border-t border-gray-200 pt-4">
                <h3 class="font-semibold text-gray-700 mb-3">kebiasaan yang terlewat (30 hari terakhir)</h3>
                <div id="statsList" class="flex flex-col gap-2"></div>
            </div>
        </div>

        <script src="js/history.js"></script>
   </body>
</html>

<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <title>TodoList</title>
        <link rel="stylesheet" href="css/style.css">
        <meta name="theme-color" content="#2563eb">
        <script src="js/authCheck.js"></script>
        <script>checkAuth('user')</script>
        <link rel="manifest" href="manifest.json">
        <script>
            if('serviceWorker' in navigation) {
                navigation.serviceWorker.register('/service-worker.js')
                .then(() => console.log(`service worker berhasil didaftarkan`))
                .catch((err) => console.log(`Gagal daftar service worker:` , err));
            }
        </script>
    </head>
    <body class="bg-gray-100 min-h-screen p-6">
        <div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class=" text-3xl font-bold text-blue-600">TodoList saya</h1>
                <a href="./history.html" class="text-sm text-blue-600 hover:underline mr-4">Lihat Riwayat</a>
                <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white font-medium px-4 py-2 rounded transition-colors cursor-pointer">Logout</button>
            </div>

            <div id="errorMessage" class="hidden"></div>
            <!-- preogress bar presentasi-->
            <div class="mb-6">
                <div class="flex justify-between text-sm text-gray-600 mb-1">
                    <span>Progress Hari Ini</span>
                    <span id="percentageText">0%</span>
                </div>
                
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progressBar" class="bg-green-500 h-3 rounded-full transition-all duration-500 ease-out" style="width: 0%;"></div>
                </div>
                <p id="summaryText" class="text-xs text-gray-400 mt-1">0 dari 0 kegiatan telah diselesaikan</p>
            </div>
            
            <!-- Form untuk todo-->
            <form id="todoForm" class="flex gap-3 mb-6">
                <input type="text" id="todoTitle" placeholder="Tambahkan kebiasaan yang ingin dibangun" required
                class="flex-1 border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded transition-colors">Tambah</button>
            </form>
            
            <!-- List Todo -->
            <ul id="todoList" class="flex flex-col gap-2"></ul>
        </div>

        <script src="js/todo.js"></script>
    </body>
</html>
